# 基础资源配置（base）
# 所有环境共享的基础 manifests，通过 overlay 差异化
#
# 注意：Secret 的来源不放 base（dev/test/perf 用 secretGenerator，staging/prod 用 ExternalSecret），
# base 里的 deployment 只「引用」app-secrets 这个 Secret 名，来源由各 overlay 决定。

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 业务服务的镜像：base 只做「短名 → 完整名」映射，tag 由各 overlay 指定
# （dev/test 用 latest，perf/staging/prod 用 v1）
# 注意：这里不能写 newTag，否则 overlay 的 tag 覆盖不生效（Kustomize images 机制）
images:
  - name: backend
    newName: hub-sh.aijidou.com/base/marriott-backend
  - name: frontend
    newName: hub-sh.aijidou.com/base/marriott-frontend

resources:
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml
  - hpa.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - postgres-init-configmap.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - configmap.yaml
  - pdb.yaml
  - priorityclass.yaml
  - networkpolicy.yaml
  - serviceaccount.yaml
