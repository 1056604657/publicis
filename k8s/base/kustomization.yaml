# 基础资源配置
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
  - name: backend
    newName: hub-sh.aijidou.com/base/marriott-backend
  - name: frontend
    newName: hub-sh.aijidou.com/base/marriott-frontend

resources:
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml
  - hpa.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - postgres-init-configmap.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - backend-configmap.yaml
  - pdb.yaml
  - priorityclass.yaml
  - networkpolicy.yaml
  - serviceaccount.yaml
