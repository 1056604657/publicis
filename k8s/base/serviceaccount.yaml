# ServiceAccount + RBAC（最小权限原则）
# 应用用独立的 ServiceAccount，不用 default SA，且不给多余权限

# 1. backend 专用的 ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
---
# 2. frontend 专用的 ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
---
# 3. backend 的 Role（只读自己 namespace 的 pod/service，供健康检查/服务发现用）
# 实际上这个简单应用不需要 K8s API 权限，这里演示「最小权限」的写法：
# 如果应用确实不需要访问 K8s API，就根本不创建 Role，SA 默认零权限
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-readonly
rules:
  # 最小权限：只读自己 namespace 的资源（如果应用需要服务发现）
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
# 4. 把 Role 绑定到 backend SA
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-readonly-binding
subjects:
  - kind: ServiceAccount
    name: backend
roleRef:
  kind: Role
  name: backend-readonly
  apiGroup: rbac.authorization.k8s.io
