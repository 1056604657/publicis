# 1. backend 专用的 ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
---
# 2. frontend 专用的 ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-readonly-binding
subjects:
  - kind: ServiceAccount
    name: backend
roleRef:
  kind: Role
  name: backend-readonly
  apiGroup: rbac.authorization.k8s.io
