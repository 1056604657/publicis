# cert-manager ClusterIssuer：letsencrypt-prod（正式 ACME 证书签发器）
# 用于 staging/production 的正式域名 TLS 证书
# 说明：ClusterIssuer 是集群级资源，一次性安装，各环境的 Ingress 通过 annotation 引用
#
# 注意：这是内网集群，ingressgateway 无公网 IP（LoadBalancer EXTERNAL-IP 为 pending），
# Let's Encrypt 从公网访问不到域名，所以此 ClusterIssuer 是「代码就绪、待公网入口」状态。
# 生产环境有公网 LB 后，用 ingress-nginx 或 Istio Gateway API 均可完成 HTTP-01 挑战。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt 正式环境（注意：生产正式域名才用 prod，测试用 staging 避免频率限制）
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@marriott.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # HTTP-01 验证：通过 Ingress 暴露的路径完成 ACME challenge
      # 生产环境有公网入口后，cert-manager 会自动创建临时 Ingress 响应挑战
      - http01:
          ingress:
            class: nginx
