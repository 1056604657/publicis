# Gateway API Gateway：ACME HTTP-01 挑战专用入口

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: acme-challenge
  namespace: istio-system
  labels:
    acme.cert-manager.io/http01-solver: "true"
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "app.marriott.com"
      allowedRoutes:
        namespaces:
          from: All
