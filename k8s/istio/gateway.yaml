# Istio Gateway：集群入口网关
# 之前集群没有 ingress-nginx，但装了 Istio，所以用 Istio Gateway 作为入口
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: marriott-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: marriott-tls
      hosts:
        - "app.marriott.com"
