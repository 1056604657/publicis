apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backend-route
  namespace: marriott-production
spec:
  gateways:
    - marriott-gateway
  hosts:
    - backend.marriott-production.svc.cluster.local
  http:
    - match:
        - headers:
            X-User-Group:
              exact: beta
      route:
        - destination:
            host: backend.marriott-production.svc.cluster.local
            subset: v2
    - route:
        - destination:
            host: backend.marriott-production.svc.cluster.local
            subset: v1
