# VirtualService：路由规则（header 灰度核心）
# 实现「按 header 定向灰度」：
#   - 请求带 X-User-Group: beta → 路由到 v2（新版）
#   - 其他请求 → 路由到 v1（旧版）
#
# 灰度发布流程（面试要能讲）：
#   1. 先部署 v2 新版（少量副本）
#   2. VirtualService 加一条 header 规则，让「测试组」用户（X-User-Group: beta）访问 v2
#   3. 观察 v2 无异常后，把 header 规则改成 weight 权重（如 90% v1 + 10% v2）
#   4. 逐步放大 v2 权重（50/50 → 100% v2）
#   5. 全部流量切到 v2，灰度完成，v1 保留作回滚点
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backend-route
spec:
  hosts:
    - backend.marriott-production.svc.cluster.local
  http:
    # 规则 1：header 定向灰度（测试组用户 → 新版 v2）
    - match:
        - headers:
            X-User-Group:
              exact: beta
      route:
        - destination:
            host: backend.marriott-production.svc.cluster.local
            subset: v2      # 新版
    # 规则 2：默认流量 → 旧版 v1
    - route:
        - destination:
            host: backend.marriott-production.svc.cluster.local
            subset: v1      # 旧版
