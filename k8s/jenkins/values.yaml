# Jenkins 部署配置（Helm values）
# 部署方式：Jenkins 部署在 K8s 里，Controller 常驻，Agent 动态创建
#
# 使用：
#   helm repo add jenkins https://charts.jenkins.io
#   helm repo update
#   helm install jenkins jenkins/jenkins -f values.yaml -n jenkins

controller:
  image:
    registry: "hub-sh.aijidou.com"
    repository: "base/jenkins"
    tag: "lts-amd64"

  imagePullSecretName: "swr-secret"


  admin:
    username: "admin"
    password: "admin123"  # 生产应改用 Secret 注入

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # 服务类型：NodePort（集群没有 LoadBalancer）
  serviceType: NodePort
  servicePort: 8080

  healthProbes: true
  healthProbeLivenessTimeout: 5
  healthProbeReadinessTimeout: 5

  installPlugins:
    - kubernetes:latest          # K8s 动态 Agent
    - workflow-aggregator:latest # Pipeline 插件集
    - git:latest                 # Git 集成
    - configuration-as-code:latest  # JCasC 配置即代码
    - blueocean:latest           # 可视化流水线
    - docker-workflow:latest     # Docker 构建
    - sonar:latest               # SonarQube 集成（代码扫描）
    - dependency-check-jenkins-plugin:latest  # 依赖漏洞扫描
    - kubernetes-cli:latest      # kubectl 集成
    - http_request:latest        # 飞书 webhook 调用

  # JCasC：流水线配置也代码化
  JCasC:
    enabled: true
    configScripts:
      welcome-message: |
        jenkins:
          systemMessage: "Marriott CI/CD Pipeline (Everything as Code)"

  # sidecar 用内网镜像（k8s-sidecar 用于 JCasC 配置热加载）
  sidecars:
    configAutoReload:
      enabled: true
      image:
        registry: "hub-sh.aijidou.com"
        repository: "base/k8s-sidecar"
        tag: "2.10.1-amd64"

persistence:
  enabled: true
  storageClass: "nfs-storage"
  size: "20Gi"

agent:
  enabled: true
  image:
    registry: "hub-sh.aijidou.com"
    repository: "base/jenkins"
    tag: "lts"

serviceAccount:
  create: true
  name: jenkins
  annotations: {}

rbac:
  create: true
