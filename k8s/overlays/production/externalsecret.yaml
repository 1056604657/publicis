# SecretStore：配置如何访问阿里云 KMS（production 环境）
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aliyun-kms
spec:
  provider:
    alibaba:
      region: cn-shanghai
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aliyun-kms-credentials
            key: access-key-id
          accessKeySecretRef:
            name: aliyun-kms-credentials
            key: access-key-secret
---
# ExternalSecret：从 KMS 同步数据库密码到 K8s Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aliyun-kms
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: marriott/prod/db-password
    - secretKey: DB_USER
      remoteRef:
        key: marriott/prod/db-user
