apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marriott-production

resources:
  - ../../base
  - namespace.yaml
  - externalsecret.yaml

images:
  - name: hub-sh.aijidou.com/base/marriott-backend
    newTag: v1-amd64
  - name: hub-sh.aijidou.com/base/marriott-frontend
    newTag: v1-amd64

replicas:
  - name: backend
    count: 0
  - name: frontend
    count: 0

patches:
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
  - target:
      kind: Service
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  - target:
      kind: Deployment
      name: redis
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis
  - target:
      kind: Service
      name: redis
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: redis
  - target:
      kind: NetworkPolicy
      name: postgres-allow-backend
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: postgres-allow-backend
  - target:
      kind: NetworkPolicy
      name: redis-allow-backend
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: redis-allow-backend
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: backend-hpa
  - target:
      kind: Ingress
      name: app-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.marriott.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.marriott.com
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: letsencrypt-prod
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: replace
        path: /data/DB_HOST
        # 由 terraform apply 注入；这里先用合法域名占位（不是 rm-xxx 这种伪装值）
        value: __RDS_ENDPOINT__    # terraform/Jenkinsfile apply 阶段替换为 rm-xxxx.mysql.rds.aliyuncs.com
      - op: replace
        path: /data/REDIS_HOST
        # 由 terraform apply 注入；这里先用合法域名占位
        value: __REDIS_ENDPOINT__  # terraform/Jenkinsfile apply 阶段替换为 r-xxxx.redis.rds.aliyuncs.com
      - op: replace
        path: /data/OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://otel-collector:4317
