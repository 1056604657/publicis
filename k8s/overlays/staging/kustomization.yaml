# staging 环境 overlay
# 预发布/UAT 使用：2 副本、启用 HPA、有 PDB、有 PriorityClass、指向云上 RDS/Redis（模拟生产）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marriott-staging

resources:
  - ../../base
  - namespace.yaml
  - externalsecret.yaml

images:
  - name: hub-sh.aijidou.com/base/marriott-backend
    newTag: v1-amd64
  - name: hub-sh.aijidou.com/base/marriott-frontend
    newTag: v1-amd64

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2

patches:
  # 删除集群内 PostgreSQL（staging 用云上 RDS）
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
  - target:
      kind: Service
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  # 删除集群内 Redis（staging 用云上 Redis）
  - target:
      kind: Deployment
      name: redis
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis
  - target:
      kind: Service
      name: redis
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: redis
  # 删除指向集群内 postgres/redis 的 NetworkPolicy（生产用云上，这两个是死策略）
  - target:
      kind: NetworkPolicy
      name: postgres-allow-backend
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: postgres-allow-backend
  - target:
      kind: NetworkPolicy
      name: redis-allow-backend
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: redis-allow-backend
  # Ingress 域名 + cert-manager 正式证书
  - target:
      kind: Ingress
      name: app-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.app.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.app.example.com
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: letsencrypt-prod
  # staging/prod 指向阿里云 RDS/Redis（由 terraform apply 后填入，不再写伪装的 rm-xxx 占位）
  # 说明：
  #   - terraform/modules/rds 和 terraform/modules/redis 已 output endpoint（见 terraform/outputs.tf）
  #   - 部署流程：terraform apply 拿到真实 endpoint → sed 替换这里 → kubectl apply -k
  #   - 流水线（terraform/Jenkinsfile apply 阶段）会自动把 endpoint 注入到 ConfigMap
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: replace
        path: /data/DB_HOST
        # 由 terraform apply 注入；这里先用合法域名占位（不是 rm-xxx 这种伪装值）
        value: __RDS_ENDPOINT__    # terraform/Jenkinsfile apply 阶段替换为 rm-xxxx.mysql.rds.aliyuncs.com
      - op: replace
        path: /data/REDIS_HOST
        # 由 terraform apply 注入；这里先用合法域名占位
        value: __REDIS_ENDPOINT__  # terraform/Jenkinsfile apply 阶段替换为 r-xxxx.redis.rds.aliyuncs.com
