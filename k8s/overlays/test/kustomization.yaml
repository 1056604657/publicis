# test 环境 overlay
# 内部 QA 测试使用：单副本、无 HPA、无 PDB、无 PriorityClass、集群内 DB/Redis
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marriott-test

resources:
  - ../../base
  - namespace.yaml

images:
  - name: hub-sh.aijidou.com/base/marriott-backend
    newTag: latest-amd64
  - name: hub-sh.aijidou.com/base/marriott-frontend
    newTag: latest-amd64

secretGenerator:
  - name: app-secrets
    literals:
      - DB_USER=app
      - DB_PASSWORD=test_password_123

replicas:
  - name: backend
    count: 1
  - name: frontend
    count: 1

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: backend-hpa
  - target:
      kind: PodDisruptionBudget
      name: backend-pdb
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: backend-pdb
  - target:
      kind: PodDisruptionBudget
      name: frontend-pdb
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: frontend-pdb
  - target:
      kind: PriorityClass
      name: app-priority
    patch: |-
      $patch: delete
      apiVersion: scheduling.k8s.io/v1
      kind: PriorityClass
      metadata:
        name: app-priority
  # 同时删除 backend/frontend 里的 priorityClassName 引用（否则 Pod 创建会报 no PriorityClass found）
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: remove
        path: /spec/template/spec/priorityClassName
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: remove
        path: /spec/template/spec/priorityClassName
  # 强制每次重启都拉最新镜像（节点 containerd 会缓存旧镜像，IfNotPresent 不重拉）
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Ingress
      name: app-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: test.app.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: test.app.example.com
