
apiVersion: v1
kind: Namespace
metadata:
  name: webhook-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mutate-webhook
  namespace: webhook-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mutate-webhook
  namespace: webhook-system
  labels:
    app: mutate-webhook
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: mutate-webhook
  template:
    metadata:
      labels:
        app: mutate-webhook
    spec:
      imagePullSecrets:
        - name: swr-secret
      serviceAccountName: mutate-webhook
      priorityClassName: system-cluster-critical
      containers:
        - name: webhook
          image: hub-sh.aijidou.com/base/marriott-webhook:v1-amd64
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: cert
              mountPath: /certs
              readOnly: true
          env:
            - name: DEFAULT_CPU_LIMIT
              value: "500m"
            - name: DEFAULT_MEM_LIMIT
              value: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: cert
          secret:
            secretName: webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: mutate-webhook
  namespace: webhook-system
spec:
  selector:
    app: mutate-webhook
  ports:
    - port: 443
      targetPort: 8443
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webhook-tls
  namespace: webhook-system
spec:
  secretName: webhook-tls
  dnsNames:
    - mutate-webhook.webhook-system.svc
    - mutate-webhook.webhook-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: webhook-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: webhook-selfsigned
  namespace: webhook-system
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutate-webhook
  annotations:
    cert-manager.io/inject-ca-from: webhook-system/webhook-tls
webhooks:
  - name: mutate.webhook.example.com
    clientConfig:
      service:
        name: mutate-webhook
        namespace: webhook-system
        path: /mutate
      caBundle: ""
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - marriott-production
            - marriott-staging
            - marriott-perf
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore 
